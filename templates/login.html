<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body>
<div class="login-page"><div class="login-card"><h1>Inventario y Remisiones</h1><p>Ingresa con tu usuario.</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post"><label>Usuario</label><input name="username" required autofocus><label>Contraseña</label><input type="password" name="password" required><button class="btn btn-primary" type="submit">Ingresar</button></form></div></div></body></html>
