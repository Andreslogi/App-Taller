{% extends 'base.html' %}{% set heading=('Editar vendedor' if salesperson else 'Nuevo vendedor') %}{% block content %}
<div class="card"><h2>{{ 'Editar vendedor' if salesperson else 'Nuevo vendedor' }}</h2><form method="post" class="form-grid">
<div><label>Nombre del vendedor</label><input name="name" required value="{{ salesperson.name if salesperson else '' }}" placeholder="Ej: James"></div>
{% if salesperson %}<div><label>Estado</label><select name="active"><option value="1" {% if salesperson.active %}selected{% endif %}>Activo</option><option value="0" {% if not salesperson.active %}selected{% endif %}>Inactivo</option></select></div>{% endif %}
<div class="form-actions"><button class="btn btn-primary" type="submit">Guardar</button><a class="btn" href="{{ url_for('salespeople') }}">Cancelar</a></div></form></div>{% endblock %}
