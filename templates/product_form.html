{% extends 'base.html' %}{% set heading='Editar producto' if product else 'Nuevo producto' %}{% block content %}<form method="post" class="card"><div class="form-grid"><div class="form-group"><label>Código *</label><input name="code" required value="{{ product.code if product else '' }}"></div><div class="form-group"><label>Descripción *</label><input name="description" required value="{{ product.description if product else '' }}"></div><div class="form-group"><label>Categoría</label><input name="category" value="{{ product.category if product else '' }}"></div><div class="form-group"><label>Unidad</label><input name="unit" value="{{ product.unit if product else 'Unidad' }}"></div>{% if not product %}<div class="form-group"><label>Stock inicial</label><input name="stock" type="number" step="0.01" value="0"></div>{% endif %}<div class="form-group"><label>Stock mínimo</label><input name="min_stock" type="number" step="0.01" value="{{ product.min_stock if product else 1 }}"></div><div class="form-group"><label>Costo unitario</label><input name="cost" type="number" step="0.01" value="{{ product.cost if product else 0 }}"></div><div class="form-group"><label>Precio de venta</label><input name="sale_price" type="number" step="0.01" value="{{ product.sale_price if product else 0 }}"></div><div class="form-group full"><label>Notas</label><textarea name="notes">{{ product.notes if product else '' }}</textarea></div></div><div class="actions"><button class="btn btn-primary">Guardar</button><a class="btn btn-light" href="{{ url_for('products') }}">Cancelar</a></div></form>{% endblock %}
