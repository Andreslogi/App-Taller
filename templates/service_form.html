{% extends 'base.html' %}{% set heading='Editar servicio' %}{% block content %}<form method="post" class="card"><div class="form-grid"><div class="form-group"><label>Nombre</label><input name="name" required value="{{ service.name }}"></div><div class="form-group"><label>Valor predeterminado</label><input name="default_price" type="number" min="0" step="0.01" required value="{{ service.default_price }}"></div><div class="form-group"><label>Estado</label><select name="active"><option value="1" {% if service.active %}selected{% endif %}>Activo</option><option value="0" {% if not service.active %}selected{% endif %}>Inactivo</option></select></div><div class="form-group"><label>Distribución</label><input value="70% trabajador / 30% negocio" disabled></div></div><div class="actions"><button class="btn btn-primary">Guardar</button><a class="btn btn-light" href="{{ url_for('services') }}">Cancelar</a></div></form>{% endblock %}
